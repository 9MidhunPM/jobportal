<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employer Dashboard</title>
  <style>
    /* --- CSS Variables for Easy Theming --- */
    :root {
      --primary-color: #6a11cb;
      --primary-color-dark: #5710a2;
      --secondary-color: #2575fc;
      --text-color: #333;
      --text-color-light: #666;
      --background-light: #f4f7f6;
      --border-color: #ddd;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --border-radius: 12px;
    }

    /* --- General Body and Layout Styles --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, var(--primary-color), var(--secondary-color));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* --- Main Dashboard Container --- */
    .dashboard-container {
      display: flex;
      gap: 2rem;
      width: 100%;
      max-width: 1200px;
      animation: fadeIn 0.6s ease-out;
    }

    .panel {
      background: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }

    .search-panel {
      flex: 1;
      max-width: 350px;
    }

    .jobs-panel {
      flex: 2;
    }

    h2 {
      font-size: 1.5rem;
      color: var(--text-color);
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    /* --- Form Elements Styling --- */
    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      color: var(--text-color-light);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(106, 17, 203, 0.3);
    }

    /* --- Button Styles --- */
    .btn {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-color-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #eee;
      color: var(--text-color);
    }
     .btn-secondary:hover {
      background-color: #ddd;
    }


    /* --- Posted Jobs Section --- */
    .jobs-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .jobs-header h2 {
        border: none;
        padding: 0;
        margin: 0;
    }

    #posted-jobs-container {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 1rem;
    }

    .job-card-item {
      background-color: var(--background-light);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      margin-bottom: 1rem;
      border-left: 5px solid var(--primary-color);
      transition: box-shadow 0.3s;
    }
    .job-card-item:hover{
        box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    }

    .job-card-item h3 {
        margin-bottom: 0.5rem;
        color: var(--text-color);
    }

    .job-meta {
        display: flex;
        gap: 1rem;
        color: var(--text-color-light);
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }
    .job-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    .job-actions .btn {
        width: auto;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
    }


    /* --- Modal Styles --- */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 700px;
      max-width: 95%;
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

     .modal-header h3 {
      font-size: 1.25rem;
      color: var(--text-color);
     }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-color-light);
      cursor: pointer;
      transition: color 0.3s;
    }
    .close-btn:hover{
        color: var(--primary-color);
    }

    .modal-body {
      padding: 2rem;
      max-height: 70vh;
      overflow-y: auto;
    }

    #jobForm {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: calc(50% - 0.75rem);
    }

    .form-group.full {
      width: 100%;
    }

    .form-group label {
      font-weight: bold;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    #customLocationField {
      display: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="overlay" class="overlay"></div>

<div class="dashboard-container">

  <aside class="panel search-panel">
    <h2>Search for Candidates</h2>
    <div class="input-group">
      <label for="searchJobTitle">Job Title</label>
      <input type="text" id="searchJobTitle" placeholder="e.g., Software Engineer">
    </div>
    <div class="input-group">
      <label for="searchExperience">Minimum Experience (years)</label>
      <input type="number" id="searchExperience" placeholder="e.g., 5">
    </div>
    <button class="btn" onclick="searchResumes()">Search Resumes</button>
  </aside>

  <main class="panel jobs-panel">
    <div class="jobs-header">
        <h2>Manage Your Job Postings</h2>
        <button class="btn" onclick="toggleModal()" style="width: auto; padding: 0.8rem 1.5rem;">Post a New Job</button>
    </div>

    <div id="posted-jobs-container">
      </div>
  </main>

</div>

<div id="jobModal" class="modal">
  <div class="modal-header">
      <h3>Post a New Job Opening</h3>
      <button class="close-btn" onclick="toggleModal()">×</button>
  </div>
  <div class="modal-body">
    <form id="jobForm">
      <div class="form-group">
        <label for="jobTitle">Job Title</label>
        <input type="text" id="jobTitle" required />
      </div>

      <div class="form-group">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" required />
      </div>

      <div class="form-group">
        <label for="experienceNeeded">Experience Needed (years)</label>
        <input type="number" id="experienceNeeded" required />
      </div>

      <div class="form-group">
        <label for="skills">Skills Required</label>
        <input type="text" id="skills" placeholder="e.g., React, Node.js, Python" required />
      </div>

       <div class="form-group">
        <label for="jobType">Job Type</label>
        <select id="jobType" required>
          <option value="">Select job type...</option>
          <option value="On-site">On-site</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">Job Location</label>
        <select id="location" required>
          <option value="">Select a location...</option>
          <option value="Bengaluru">Bengaluru</option>
          <option value="Chennai">Chennai</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Hyderabad">Hyderabad</option>
          <option value="Delhi">Delhi</option>
          <option value="Other">Other</option>
        </select>
      </div>
      
      <div class="form-group full" id="customLocationField">
        <label for="customLocation">Enter Custom Location</label>
        <input type="text" id="customLocation" placeholder="e.g., Pune, Maharashtra">
      </div>

      <div class="form-group full">
        <label for="jobDesc">Job Description</label>
        <input type="text" id="jobDesc" placeholder="Describe the role and responsibilities" required />
      </div>

      <div class="form-group full">
        <button type="submit" class="btn">Submit Job Posting</button>
      </div>
    </form>
  </div>
</div>


<script>
  // --- DOM Element References ---
  const modal = document.getElementById("jobModal");
  const overlay = document.getElementById("overlay");
  const locationSelect = document.getElementById("location");
  const customLocationField = document.getElementById("customLocationField");
  const customLocationInput = document.getElementById("customLocation");
  const jobForm = document.getElementById("jobForm");
  const postedJobsContainer = document.getElementById("posted-jobs-container");

  // --- Mock Data: Simulates jobs already posted by the employer ---
  const postedJobs = [
    {
      jobTitle: "Senior Frontend Developer",
      companyName: "Pixelwave Solutions",
      location: "Bengaluru",
      jobType: "On-site"
    },
    {
      jobTitle: "Product Manager",
      companyName: "Innovate Inc.",
      location: "Remote",
      jobType: "Remote"
    }
  ];

  // --- Core Functions ---
  function toggleModal() {
    modal.classList.toggle("active");
    overlay.classList.toggle("active");
  }

  function renderPostedJobs() {
    postedJobsContainer.innerHTML = ""; // Clear existing list
    if (postedJobs.length === 0) {
        postedJobsContainer.innerHTML = "<p>You have not posted any jobs yet.</p>";
        return;
    }

    postedJobs.forEach(job => {
      const jobCard = document.createElement("div");
      jobCard.className = "job-card-item";

      jobCard.innerHTML = `
        <h3>${job.jobTitle}</h3>
        <div class="job-meta">
          <span>📍 ${job.location}</span>
          <span>🏢 ${job.companyName}</span>
          <span>🕒 ${job.jobType}</span>
        </div>
        <div class="job-actions">
            <button class="btn">View Applicants</button>
            <button class="btn btn-secondary">Edit</button>
        </div>
      `;
      postedJobsContainer.appendChild(jobCard);
    });
  }


  function searchResumes() {
    const filters = {
      jobTitle: document.getElementById("searchJobTitle").value,
      experience: document.getElementById("searchExperience").value,
    };
    // In a real app, this would trigger an API call.
    alert("Searching Resumes With Filters:\n" + JSON.stringify(filters, null, 2));
  }

  // --- Event Listeners ---
  overlay.addEventListener("click", toggleModal);

  locationSelect.addEventListener("change", () => {
    customLocationField.style.display = locationSelect.value === "Other" ? "flex" : "none";
    if (locationSelect.value !== "Other") {
      customLocationInput.value = "";
    }
  });

  jobForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const selectedLocation = locationSelect.value === "Other"
      ? customLocationInput.value.trim() || "Not Specified"
      : locationSelect.value;

    const newJobData = {
      jobTitle: document.getElementById("jobTitle").value,
      companyName: document.getElementById("companyName").value,
      experienceNeeded: document.getElementById("experienceNeeded").value,
      skills: document.getElementById("skills").value,
      jobDesc: document.getElementById("jobDesc").value,
      location: selectedLocation,
      jobType: document.getElementById("jobType").value
    };

    // Add the new job to our data array
    postedJobs.unshift(newJobData);
    
    // In a real app, you would send this to a server.
    alert("New Job Posted Successfully!");
    
    // Hide the modal and reset the form
    toggleModal();
    this.reset();
    customLocationField.style.display = "none";

    // Re-render the list of jobs to include the new one
    renderPostedJobs();
  });

  // --- Initial Render on Page Load ---
  document.addEventListener("DOMContentLoaded", renderPostedJobs);

</script>

</body>
</html>
