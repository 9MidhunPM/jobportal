<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Portal – Styled</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: white;
      width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.2rem;
      color: #333;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.8rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .search-bar button {
      padding: 0.8rem 1rem;
      background-color: #6a11cb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-bar button:hover {
      background-color: #5710a2;
    }

    .filters {
      display: none;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filters select {
      flex: 1;
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    ul.job-list {
      list-style: none;
      padding: 0;
      margin-top: 1rem;
    }

    ul.job-list li {
      background-color: #f9f9f9;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 0.8rem;
      transition: transform 0.2s ease;
    }

    ul.job-list li:hover {
      transform: scale(1.02);
      background-color: #f0f0f0;
    }

    ul.job-list li a {
      color: #6a11cb;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1rem;
    }

    ul.job-list li p {
      margin: 4px 0;
      color: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Scrollbar for WebKit browsers */
    .card::-webkit-scrollbar {
      width: 10px;
    }

    .card::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .card::-webkit-scrollbar-thumb {
      background: #6a11cb;
      border-radius: 10px;
    }

    .card::-webkit-scrollbar-thumb:hover {
      background: #5710a2;
    }

    /* Scrollbar for Firefox */
    .card {
      scrollbar-width: thin;
      scrollbar-color: #6a11cb #f1f1f1;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Current Job Offers</h2>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search job titles..." />
    <button id="filterToggle">Filters</button>
  </div>

  <div class="filters" id="filterBox">
    <select id="location">
      <option value="">All Locations</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Kochi">Kochi</option>
      <option value="Remote">Remote</option>
    </select>
    <select id="experience">
      <option value="">All Experience Levels</option>
      <option value="Fresher">Fresher</option>
      <option value="1-3 Years">1-3 Years</option>
      <option value="3+ Years">3+ Years</option>
    </select>
  </div>

  <ul class="job-list" id="jobList"></ul>
</div>

<script>
  const jobs = [
    { id: 1, title: 'Frontend Developer', location: 'Bangalore', experience: '1-3 Years' },
    { id: 2, title: 'Backend Intern', location: 'Kochi', experience: 'Fresher' },
    { id: 3, title: 'Full Stack Engineer', location: 'Remote', experience: '3+ Years' },
    { id: 4, title: 'Game Developer', location: 'Kochi', experience: '1-3 Years' },
    { id: 5, title: 'Data Analyst', location: 'Bangalore', experience: 'Fresher' }
  ];

  const searchInput = document.getElementById('search');
  const locationSelect = document.getElementById('location');
  const experienceSelect = document.getElementById('experience');
  const jobList = document.getElementById('jobList');
  const filterToggle = document.getElementById('filterToggle');
  const filterBox = document.getElementById('filterBox');

  filterToggle.addEventListener('click', () => {
    filterBox.style.display = (filterBox.style.display === 'none' || filterBox.style.display === '') ? 'flex' : 'none';
  });

  function renderJobs(filteredJobs) {
    jobList.innerHTML = '';
    if (filteredJobs.length === 0) {
      jobList.innerHTML = '<li>No jobs found.</li>';
      return;
    }

    filteredJobs.forEach(job => {
      const li = document.createElement('li');
      li.innerHTML = `
        <a href="job.html?id=${job.id}">${job.title}</a>
        <p>Location: ${job.location}</p>
        <p>Experience: ${job.experience}</p>
      `;
      jobList.appendChild(li);
    });
  }

  function filterJobs() {
    const searchTerm = searchInput.value.toLowerCase();
    const location = locationSelect.value;
    const experience = experienceSelect.value;

    const filtered = jobs.filter(job => {
      const matchesSearch = job.title.toLowerCase().includes(searchTerm);
      const matchesLocation = !location || job.location === location;
      const matchesExperience = !experience || job.experience === experience;
      return matchesSearch && matchesLocation && matchesExperience;
    });

    renderJobs(filtered);
  }

  // Event listeners
  searchInput.addEventListener('input', filterJobs);
  locationSelect.addEventListener('change', filterJobs);
  experienceSelect.addEventListener('change', filterJobs);

  // Initial render
  renderJobs(jobs);
</script>

</body>
</html>
